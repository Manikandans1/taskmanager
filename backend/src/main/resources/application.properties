# ==============================
# Server
# ==============================
server.port=${PORT:8080}

# ==============================
# Database (PostgreSQL)
# Set these as environment variables in your deployment platform (Render/Railway)
# or in a local .env loaded by your shell before running the app.
# Example DATABASE_URL: jdbc:postgresql://<host>:5432/<dbname>
# ==============================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/taskmanager}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# JPA / Hibernate
# "update" auto-creates/updates tables from entities - fine for this assignment.
# Switch to "validate" + a migration tool (Flyway) for a real production app.
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ==============================
# JWT
# JWT_SECRET must be a long random string (32+ chars) - generate your own for production.
# ==============================
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-key-before-deploying-1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==============================
# Groq AI API (https://console.groq.com)
# Never expose this key to the frontend - it is only read here, server-side.
# ==============================
app.groq.api-key=${GROQ_API_KEY:}
app.groq.api-url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
app.groq.model=${GROQ_MODEL:llama-3.1-8b-instant}

# ==============================
# CORS
# Set this to your deployed frontend URL in production (comma-separated for multiple).
# ==============================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
